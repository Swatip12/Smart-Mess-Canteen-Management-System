<div class="page-container">
  <div class="page-header mb-4">
    <div class="d-flex align-items-center gap-2 mb-1">
      <a routerLink="/canteens" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h2 class="mb-0">Add New Canteen</h2>
    </div>
    <p class="text-muted ms-4 ps-2 mb-0">Register a new food canteen or cafeteria</p>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form [formGroup]="canteenForm" (ngSubmit)="addCanteen()">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label fw-semibold">Canteen Name <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="name"
                  placeholder="e.g. Central Cafeteria & Snack Bar">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Location <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="location"
                  placeholder="e.g. Student Activity Center, 1st Floor">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Contact Number</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="contactNumber"
                  placeholder="e.g. +91 9876543211">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Opening Time</label>
                <input
                  type="time"
                  class="form-control"
                  formControlName="openingTime">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Closing Time</label>
                <input
                  type="time"
                  class="form-control"
                  formControlName="closingTime">
              </div>

              <div class="col-md-12">
                <div class="form-check form-switch mt-2">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="isActive"
                    formControlName="isActive">
                  <label class="form-check-label fw-semibold" for="isActive">
                    Canteen is currently Active and Accepting Orders
                  </label>
                </div>
              </div>
            </div>

            <hr class="my-4 text-muted">

            <div class="d-flex justify-content-end gap-2">
              <button
                type="button"
                class="btn btn-light border px-4"
                (click)="cancel()">
                Cancel
              </button>
              <button
                type="submit"
                class="btn btn-primary px-4 d-flex align-items-center gap-2"
                [disabled]="canteenForm.invalid">
                <i class="bi bi-check2-circle"></i>
                Save Canteen
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
