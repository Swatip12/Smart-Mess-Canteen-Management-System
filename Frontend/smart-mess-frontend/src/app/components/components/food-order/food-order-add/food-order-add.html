<div class="page-container">
  <div class="page-header mb-4">
    <div class="d-flex align-items-center gap-2 mb-1">
      <a routerLink="/orders" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h2 class="mb-0">Create Canteen Order</h2>
    </div>
    <p class="text-muted ms-4 ps-2 mb-0">Record a new walk-in or manual order for a student</p>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form [formGroup]="orderForm" (ngSubmit)="addOrder()">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Select Student <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="studentId">
                  <option [ngValue]="null">-- Select Student --</option>
                  <option *ngFor="let student of students" [ngValue]="student.id">
                    {{ student.name }} ({{ student.rollNumber || student.email }})
                  </option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Canteen Outlet <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="canteenId">
                  <option [ngValue]="null">-- Select Canteen --</option>
                  <option *ngFor="let canteen of canteens" [ngValue]="canteen.id">
                    {{ canteen.name }} ({{ canteen.location }})
                  </option>
                </select>
              </div>

              <div class="col-md-8">
                <label class="form-label fw-semibold">Select Food Item <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="foodItemId" (change)="onFoodItemChange()">
                  <option [ngValue]="null">-- Choose Food Item --</option>
                  <option *ngFor="let item of foodItems" [ngValue]="item.id">
                    {{ item.name }} - ₹{{ item.price }} ({{ item.category }})
                  </option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-semibold">Quantity <span class="text-danger">*</span></label>
                <input
                  type="number"
                  class="form-control"
                  formControlName="quantity"
                  min="1">
              </div>

              <div class="col-md-6" *ngIf="selectedFoodItem">
                <label class="form-label fw-semibold">Estimated Total Amount</label>
                <div class="input-group">
                  <span class="input-group-text">₹</span>
                  <input
                    type="text"
                    class="form-control fw-bold bg-light"
                    [value]="(selectedFoodItem.price || 0) * (orderForm.get('quantity')?.value || 1)"
                    readonly>
                </div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Initial Status</label>
                <select class="form-select" formControlName="status">
                  <option value="PENDING">PENDING</option>
                  <option value="CONFIRMED">CONFIRMED</option>
                </select>
              </div>
            </div>

            <hr class="my-4 text-muted">

            <div class="d-flex justify-content-end gap-2">
              <button
                type="button"
                class="btn btn-light border px-4"
                (click)="cancel()">
                Cancel
              </button>
              <button
                type="submit"
                class="btn btn-primary px-4 d-flex align-items-center gap-2"
                [disabled]="orderForm.invalid">
                <i class="bi bi-cart-check"></i>
                Place Order
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
