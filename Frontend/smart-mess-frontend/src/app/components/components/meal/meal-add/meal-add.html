<div class="page-container">
  <div class="page-header mb-4">
    <div class="d-flex align-items-center gap-2 mb-1">
      <a routerLink="/meals" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h2 class="mb-0">Add Meal Session</h2>
    </div>
    <p class="text-muted ms-4 ps-2 mb-0">Define meal serving window and details</p>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form [formGroup]="mealForm" (ngSubmit)="addMeal()">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold">Meal Name <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="name"
                  placeholder="e.g. Breakfast, Lunch, High Tea, Dinner">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Serving Hours <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="serveTime"
                  placeholder="e.g. 07:30 AM - 09:30 AM">
              </div>

              <div class="col-md-12">
                <label class="form-label fw-semibold">Mess Facility (Optional)</label>
                <select class="form-select" formControlName="messId">
                  <option value="">All Messes (Default)</option>
                  <option *ngFor="let m of messes" [value]="m.id">{{ m.name }} ({{ m.location }})</option>
                </select>
              </div>

              <div class="col-md-12">
                <label class="form-label fw-semibold">Description</label>
                <textarea
                  class="form-control"
                  rows="3"
                  formControlName="description"
                  placeholder="e.g. Standard morning breakfast served with tea and coffee"></textarea>
              </div>
            </div>

            <hr class="my-4 text-muted">

            <div class="d-flex justify-content-end gap-2">
              <button
                type="button"
                class="btn btn-light border px-4"
                (click)="cancel()">
                Cancel
              </button>
              <button
                type="submit"
                class="btn btn-primary px-4 d-flex align-items-center gap-2"
                [disabled]="mealForm.invalid || submitting">
                <i class="bi bi-check2-circle"></i>
                Save Meal Session
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
