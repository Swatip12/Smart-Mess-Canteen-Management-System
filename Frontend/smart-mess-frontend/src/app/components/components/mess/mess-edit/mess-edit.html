<div class="page-container">
  <div class="page-header mb-4">
    <div class="d-flex align-items-center gap-2 mb-1">
      <a routerLink="/messes" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h2 class="mb-0">Edit Mess</h2>
    </div>
    <p class="text-muted ms-4 ps-2 mb-0">Update information for this mess facility</p>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <form [formGroup]="messForm" (ngSubmit)="updateMess()">
            <div class="row g-3">
              <div class="col-md-12">
                <label class="form-label fw-semibold">Mess Name <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="name">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Location <span class="text-danger">*</span></label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="location">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Contact Number</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="contactNumber">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Seating Capacity</label>
                <input
                  type="number"
                  class="form-control"
                  formControlName="capacity">
              </div>

              <div class="col-md-6">
                <label class="form-label fw-semibold">Dietary Type</label>
                <select
                  class="form-select"
                  formControlName="type">
                  <option value="VEG">VEG (Vegetarian Only)</option>
                  <option value="NON_VEG">NON_VEG (Non-Vegetarian Only)</option>
                  <option value="BOTH">BOTH (Veg & Non-Veg)</option>
                </select>
              </div>
            </div>

            <hr class="my-4 text-muted">

            <div class="d-flex justify-content-end gap-2">
              <button
                type="button"
                class="btn btn-light border px-4"
                (click)="cancel()">
                Cancel
              </button>
              <button
                type="submit"
                class="btn btn-primary px-4 d-flex align-items-center gap-2"
                [disabled]="messForm.invalid">
                <i class="bi bi-save"></i>
                Update Mess
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
