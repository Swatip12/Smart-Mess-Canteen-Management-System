<div class="student-add-container">

  <div class="page-header">

    <div>
      <h1>Add Student</h1>
      <p>
        Register a new student in Smart Mess Management System
      </p>
    </div>

  </div>


  <div class="form-card">

    <h2>Student Information</h2>


    <form
      [formGroup]="studentForm"
      (ngSubmit)="submitForm()">


      <div class="form-grid">


        <div class="form-group">

          <label>
            Name <span>*</span>
          </label>

          <input
            type="text"
            formControlName="name"
            placeholder="Enter student name"
          />

          <small
            *ngIf="
              studentForm.get('name')?.touched &&
              studentForm.get('name')?.invalid
            ">

            Name is required.

          </small>

        </div>


        <div class="form-group">

          <label>
            Email <span>*</span>
          </label>

          <input
            type="email"
            formControlName="email"
            placeholder="Enter email address"
          />

          <small
            *ngIf="
              studentForm.get('email')?.touched &&
              studentForm.get('email')?.invalid
            ">

            Enter a valid email.

          </small>

        </div>


        <div class="form-group">

          <label>
            Password <span>*</span>
          </label>

          <input
            type="password"
            formControlName="password"
            placeholder="Enter password"
          />

        </div>


        <div class="form-group">

          <label>Phone</label>

          <input
            type="text"
            formControlName="phone"
            placeholder="Enter phone number"
          />

        </div>


        <div class="form-group">

          <label>Roll Number</label>

          <input
            type="text"
            formControlName="rollNumber"
            placeholder="Enter roll number"
          />

        </div>


        <div class="form-group">

          <label>Department</label>

          <input
            type="text"
            formControlName="department"
            placeholder="Enter department"
          />

        </div>


        <div class="form-group">

          <label>Hostel Name</label>

          <input
            type="text"
            formControlName="hostelName"
            placeholder="Enter hostel name"
          />

        </div>


        <div class="form-group">

          <label>Room Number</label>

          <input
            type="text"
            formControlName="roomNumber"
            placeholder="Enter room number"
          />

        </div>


      </div>


      <div class="form-actions">

        <button
          type="button"
          class="btn-cancel"
          (click)="cancel()">

          Cancel

        </button>


        <button
          type="submit"
          class="btn-submit"
          [disabled]="studentForm.invalid">

          Add Student

        </button>

      </div>


    </form>

  </div>

</div>
