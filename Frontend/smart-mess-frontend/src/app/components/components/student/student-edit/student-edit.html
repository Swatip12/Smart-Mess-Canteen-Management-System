<div class="student-edit-container">

  <!-- Header -->
  <div class="page-header-box">
    <div>
      <h2>Edit Student</h2>
      <p>Update student details and hostel allocation</p>
    </div>
    <button type="button" class="btn btn-outline-secondary" (click)="cancel()">
      <i class="bi bi-arrow-left me-1"></i> Back to Students
    </button>
  </div>

  <div class="card border-0 shadow-sm p-4">
    <form [formGroup]="studentForm" (ngSubmit)="updateStudent()">

      <div class="row g-3">

        <!-- Name -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            formControlName="name"
            placeholder="Enter student full name"
          />
        </div>

        <!-- Email -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
          <input
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="student@example.com"
          />
        </div>

        <!-- Password -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
          <input
            type="text"
            class="form-control"
            formControlName="password"
            placeholder="Enter password"
          />
        </div>

        <!-- Phone -->
        <div class="col-md-6">
          <label class="form-label fw-semibold">Phone Number</label>
          <input
            type="text"
            class="form-control"
            formControlName="phone"
            placeholder="e.g. 9876543210"
          />
        </div>

        <!-- Roll Number -->
        <div class="col-md-4">
          <label class="form-label fw-semibold">Roll Number</label>
          <input
            type="text"
            class="form-control"
            formControlName="rollNumber"
            placeholder="e.g. 21"
          />
        </div>

        <!-- Department -->
        <div class="col-md-4">
          <label class="form-label fw-semibold">Department</label>
          <input
            type="text"
            class="form-control"
            formControlName="department"
            placeholder="e.g. IT, CS, Mechanical"
          />
        </div>

        <!-- Hostel Name -->
        <div class="col-md-4">
          <label class="form-label fw-semibold">Hostel Name</label>
          <input
            type="text"
            class="form-control"
            formControlName="hostelName"
            placeholder="e.g. Girls Hostel A"
          />
        </div>

        <!-- Room Number -->
        <div class="col-md-4">
          <label class="form-label fw-semibold">Room Number</label>
          <input
            type="text"
            class="form-control"
            formControlName="roomNumber"
            placeholder="e.g. 204"
          />
        </div>

      </div>

      <!-- Action Buttons -->
      <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <button type="button" class="btn btn-secondary" (click)="cancel()">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="studentForm.invalid">
          <i class="bi bi-check-lg me-1"></i> Update Student
        </button>
      </div>

    </form>
  </div>

</div>
